<!DOCTYPE html>
<html lang="en" data-theme="catppuccin-mocha" data-accent="green">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e2e">
  <title>botyaracloud</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fileicons.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

  <header class="topbar">
    <a href="/" class="brand" title="botyaracloud">
      <span class="nf">&#xeb09;</span>
      <span class="brand-name">botyaracloud</span>
    </a>
    <div class="topbar-actions">
      {% block topbar_actions %}{% endblock %}
      <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
        <span class="nf">&#xf013;</span>
      </button>
    </div>
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  {% include 'components/settings_modal.html' %}
  {% include 'components/context_menu.html' %}
  {% include 'components/file_viewer_modal.html' %}

  <div id="toast-container"></div>

  <!-- Локальный Socket.IO для полной автономности в локальной сети -->
  <script src="{{ url_for('static', filename='js/vendor/socket.io.min.js') }}"></script>

  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
  <script src="{{ url_for('static', filename='js/socket.js') }}"></script>
  <script src="{{ url_for('static', filename='js/contextmenu.js') }}"></script>
  <script src="{{ url_for('static', filename='js/fileviewer.js') }}"></script>
  <script src="{{ url_for('static', filename='js/navigation.js') }}"></script>
  <script src="{{ url_for('static', filename='js/search.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
